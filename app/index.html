<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<title>Aplicação Exemplo</title>
<link rel="stylesheet" type="text/css" href="css.css" media="screen" />
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
</head>
<body>

<div class="container">
  <form id="contact" method="post">
    <h3>App de exemplo</h3>
    <h4>Deixe a sua mensagem!</h4>
    <fieldset>
      <input placeholder="Seu Nome" type="text" tabindex="1" id="nome" required autofocus>
    </fieldset>
    <fieldset>
      <input placeholder="Seu Email" type="email" tabindex="2" id="email" required>
    </fieldset>
    <fieldset>
      <textarea placeholder="Digite a sua mensagem aqui......" id="comentario" tabindex="3" required></textarea>
    </fieldset>
    <fieldset>
      <button type="button" name="btn_salvar" id="btn_gravar">Enviar</button>
    </fieldset>
  </form>

  <div id="resposta"></div>
</div>

<script src="js.js"></script>
</body>
</html>
